name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # buildozer 在 Linux 上需要这些系统包。Windows 上是跑不了的（要 WSL），
      # 所以整个构建放在这里做，本地一个字节的 SDK/NDK 都不用下。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython

      # 第一次运行仍然要下 Android SDK / NDK（约 1.5 GB，40 分钟左右）；
      # 有了这个缓存之后，后续构建通常 5~10 分钟。
      # 改了 buildozer.spec 的 key 会重建缓存 —— 这是故意的，
      # 因为 SDK/API 级别变了就必须重新拉工具链。
      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # Android 上不换字体的话中文歌词会显示成方框（Kivy 自带的 Roboto 没有汉字）。
      # 这个文件会被 source.include_exts 里的 otf 规则打包进 APK。
      # 下载失败也不影响构建 —— App 会退回使用 /system/fonts 里的字体。
      - name: Fetch CJK font for the APK
        run: |
          mkdir -p fonts
          PRIMARY="https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf"
          FALLBACK="https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf"
          curl -fsSL -o fonts/NotoSansSC-Regular.otf "$PRIMARY" \
            || curl -fsSL -o fonts/NotoSansSC-Regular.otf "$FALLBACK" \
            || echo "::warning::字体下载失败，App 将退回使用系统字体"
          ls -lh fonts || true

      # 先单独跑 update，把 SDK/NDK 灌进缓存。这样即使后面的构建失败，
      # 下次重跑也能直接从缓存开始。
      - name: Download Android SDK / NDK
        run: buildozer android update || true

      - name: Build debug APK
        run: buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lrcviewer-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Show result
        run: ls -lh bin/ || true
